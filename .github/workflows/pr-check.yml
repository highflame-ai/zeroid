name: PR Merge Check - Zeroid

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - "main"
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

env:
  GO_VER: "1.27.0"
  PYTHON_VER: "3.12"
  NODE_VER: "22"
  DOCKER_BUILD_RECORD_UPLOAD: false
  GH_SEC_REPORT: false
  TRIVY_SEVERITY: "HIGH,CRITICAL"
  TRIVY_REPORT_FILE: "trivy-scan-result"

jobs:
  highflame-build-check:
    permissions:
      contents: 'read'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Golang Version
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VER }}
          cache: false

      - name: Cache Go modules and build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ env.GO_VER }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_VER }}-

      - name: Build Go Binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
        shell: bash
        run: |-
          go vet
          go build

  highflame-lint-check:
    permissions:
      contents: 'read'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Golang Version
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VER }}
          cache: false

      - name: Cache Go modules and build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ env.GO_VER }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_VER }}-

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # The linter binary must be built with a Go >= the modules' go
          # directive ("the Go language version used to build golangci-lint
          # is lower than the targeted Go version"). Modules target 1.27.0;
          # v2.13.2 is the current release built against it.
          version: v2.13.2
          args: --timeout=5m

  highflame-docker-check:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: "pr-check-image"
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          pull: true
          push: false
          context: .
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  highflame-integration-test:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VER }}
          cache: false

      - name: Cache Go modules and build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ env.GO_VER }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_VER }}-

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VER }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VER }}

      # Unit tests live next to their packages (pkg/dpop, pkg/authjwt,
      # internal/service, domain, config) and were previously not run in CI
      # at all — only ./tests/... was. Run them with the race detector
      # (which requires cgo) to cover the concurrency-sensitive surfaces.
      - name: Run Go unit tests (race detector)
        env:
          CGO_ENABLED: 1
        shell: bash
        run: |-
          go test $(go list ./... | grep -v '/tests') -race -count=1 -timeout=300s

      - name: Run Go integration tests in tests/
        env:
          CGO_ENABLED: 1
        shell: bash
        run: |-
          go test ./tests/... -v -race -count=1 -timeout=600s

      - name: Install Python SDK smoke dependencies
        shell: bash
        run: |-
          pip install --quiet "testcontainers[postgres]" "PyJWT>=2.8" cryptography pytest
          pip install --quiet "highflame==0.3.23"

      - name: Run Python SDK smoke tests
        run: pytest tests/sdk/test_sdk_smoke.py -v --tb=short -x

      - name: Install TypeScript SDK smoke dependencies
        working-directory: tests/sdk
        shell: bash
        run: |-
          npm init -y
          npm install --save-dev vitest typescript @testcontainers/postgresql
          npm install @highflame/sdk@0.3.23

      - name: Run TypeScript SDK smoke tests
        working-directory: tests/sdk
        shell: bash
        run: |-
         npx vitest run sdk-smoke.test.ts --reporter=verbose

  # CLI unit tests (cli/) — an offline, msw-mocked vitest suite that already
  # exists (`make cli-test`) but was never wired into CI. highflame-sdk#93.
  highflame-cli-check:
    permissions:
      contents: 'read'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VER }}

      - name: Run CLI unit tests (offline, msw-mocked)
        shell: bash
        run: make cli-test

  # Executes the zeroid quickstart example notebook end-to-end against a live
  # server, so a change that breaks the documented getting-started flow fails the
  # PR. Mirrors the notebook's own prerequisites (`make setup-keys` + docker
  # compose on :8899, which the notebook hardcodes). The notebook's own `assert`s
  # (revocation, CAE auto-revoke) are the pass/fail signal. highflame-sdk#93.
  highflame-notebook-check:
    permissions:
      contents: 'read'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VER }}

      - name: Generate signing keys
        shell: bash
        run: make setup-keys

      - name: Start zeroid + postgres (docker compose, wait for health)
        shell: bash
        run: docker compose up --build -d --wait

      - name: Install notebook execution deps
        shell: bash
        run: pip install --quiet pytest nbmake ipykernel "highflame==0.3.23" cryptography "PyJWT>=2.8"

      - name: Execute the quickstart notebook against the live server
        shell: bash
        run: pytest --nbmake --nbmake-timeout=300 examples/zeroid_quickstart.ipynb -v

      - name: Dump zeroid logs on failure
        if: failure()
        shell: bash
        run: docker compose logs zeroid | tail -200

      - name: Teardown
        if: always()
        shell: bash
        run: docker compose down -v

  highflame-trivy-check:
    permissions:
      contents: 'read'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Manual Trivy Setup
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          cache: true
          version: ${{ env.TRIVY_VER }}

      - name: Trivy Scan - Text Security Report
        id: trivy_scan_txt
        if: ${{ env.GH_SEC_REPORT == 'false' }}
        uses: aquasecurity/trivy-action@v0.35.0
        continue-on-error: true
        with:
          ignore-unfixed: true
          skip-setup-trivy: true
          scan-type: "fs"
          cache: "false"
          format: "table"
          output: "${{ env.TRIVY_REPORT_FILE }}.txt"
          severity: "${{ env.TRIVY_SEVERITY }}"
          exit-code: 1

      - name: Upload Report - Text Security Report
        if: ${{ env.GH_SEC_REPORT == 'false' && steps.trivy_scan_txt.outcome  == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.TRIVY_REPORT_FILE }}"
          path: "${{ env.TRIVY_REPORT_FILE }}.txt"
          if-no-files-found: error
          retention-days: 1

      - name: Trivy Scan - GitHub Security Report
        id: trivy_scan_sec
        if: ${{ env.GH_SEC_REPORT == 'true' }}
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          ignore-unfixed: true
          skip-setup-trivy: true
          scan-type: "fs"
          cache: "false"
          format: "sarif"
          output: "${{ env.TRIVY_REPORT_FILE }}.sarif"
          severity: "${{ env.TRIVY_SEVERITY }}"
          timeout: "${{ env.TRIVY_TIMEOUT }}"
          exit-code: 1

      - name: Upload Report - GitHub Security Report
        if: ${{ env.GH_SEC_REPORT == 'true' && steps.trivy_scan_sec.outcome  == 'failure' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "${{ env.TRIVY_REPORT_FILE }}.sarif"

      - name: Failing the Job
        if: ${{ steps.trivy_scan_txt.outcome  == 'failure' || steps.trivy_scan_sec.outcome  == 'failure' }}
        shell: bash
        run: |-
          echo "Vulnerabilities Found.....!"
          exit 1