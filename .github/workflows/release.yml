name: Release Build - Zeroid

on:
  release:
    types:
      - published

env:
  GO_VER: "1.27.0"
  REGEX_PATTERN: "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
  # release.tag_name is the git tag (e.g. v1.7.0) — what consumers
  # `go get`. Not release.name, which is the human-readable display
  # title and can be customised in the UI to something like
  # "v1.7.0 — PKCE PrincipalResolver" that would fail the tag-format
  # regex. tag_name is the load-bearing identifier for every gate in
  # this workflow.
  RELEASE_TAG: ${{ github.event.release.tag_name }}
  DEVOPS_REPO: "highflame-cloud"
  DEVOPS_BRANCH: "main"
  CICD_WORKFLOW: "trigger-release-zeroid.yml"

jobs:
  highflame-validate:
    permissions:
      contents: 'read'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      # Tag format gate. The original workflow gated this on
      # `steps.validate_branch.outputs.enable_branch_build == 'true'`,
      # but `validate_branch` was never a real step in this job — the
      # gate evaluated to false and the validation silently skipped on
      # every release. Removed; the format check now actually runs.
      - name: Validate Release Tag
        id: validate_tag
        shell: bash
        run: |-
          if [[ "${{ env.RELEASE_TAG }}" =~ ${{ env.REGEX_PATTERN }} ]] ; then
            echo "Valid version format: ${{ env.RELEASE_TAG }}"
          else
            echo "Invalid version format: ${{ env.RELEASE_TAG }}"
            exit 1
          fi

      - name: Setup Golang Version
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VER }}
          cache: false

      # svu (caarlos0/svu) computes the semver bump implied by commit
      # messages since the last `v*` tag. Highflame's commit-prefix
      # convention maps cleanly onto Conventional Commits for the bumps:
      # `feat:` -> minor, `fix:` -> patch, `feat!:` / `BREAKING CHANGE:`
      # -> major. `devops:`, `build(deps)`, `[Snyk]`, `Bump` don't move
      # version numbers in svu's model, which matches our intent (those
      # are housekeeping, not user-visible).
      #
      # Behaviour: fail if the published tag is BELOW svu's
      # recommendation -- that means a `feat:` commit was missed and
      # we'd be silently shipping a feature as a patch. Allow tags AT
      # OR ABOVE the recommendation so a maintainer can manually force
      # a higher bump (e.g., release a major from a fix-only window).
      - name: Validate semver against commit history (svu)
        shell: bash
        run: |-
          go install github.com/caarlos0/svu/v3@latest
          EXPECTED="$(svu next)"
          ACTUAL="${{ env.RELEASE_TAG }}"
          echo "Published tag : ${ACTUAL}"
          echo "svu next      : ${EXPECTED}"
          # sort -V picks the highest of the two; if EXPECTED is
          # higher, ACTUAL is too low and a feat: was likely missed.
          HIGHEST="$(printf '%s\n%s\n' "${EXPECTED}" "${ACTUAL}" | sort -V | tail -1)"
          if [[ "${ACTUAL}" != "${EXPECTED}" && "${HIGHEST}" != "${ACTUAL}" ]]; then
            echo "::error::Release tag ${ACTUAL} is below svu's computed next version ${EXPECTED}."
            echo "::error::This usually means a feat: commit since the last tag implied a minor bump."
            echo "::error::Either retag at ${EXPECTED} or higher, or audit recent commit prefixes."
            exit 1
          fi
          if [[ "${ACTUAL}" != "${EXPECTED}" ]]; then
            echo "::notice::Release tag ${ACTUAL} is ahead of svu's recommendation (${EXPECTED}). Treating as an intentional manual bump."
          else
            echo "Release tag matches svu recommendation."
          fi

      # Submodule drift guard. zeroid is a Go module containing nested
      # published modules at pkg/dpop and pkg/authjwt, and zeroid's
      # NON-test code imports both — so downstream consumers pull them
      # transitively and the require pins in go.mod are what the proxy
      # actually serves. Local `replace` directives do NOT reach
      # consumers. See RELEASING.md.
      #
      # This catches two foot-guns:
      #
      #   1. Source drift. If a submodule's source on main has diverged
      #      from the version go.mod references, releasing zeroid ships
      #      a binary against the OLD published module while in-repo
      #      tests passed against the NEW local source — a silent
      #      regression, because the replace hides it locally.
      #
      #   2. Placeholder pins. A v0.0.0 (or any unpublished) reference
      #      makes zeroid UNRESOLVABLE from the proxy: a fresh module
      #      running `go get github.com/highflame-ai/zeroid@vX.Y.Z`
      #      fails with "unknown revision". In-repo builds never notice,
      #      again because of the replace.
      #
      # pkg/authjwt was exempted here until it was found to have been
      # imported from non-test code since private_key_jwt (#347) added
      # internal/service/client_jwks.go — while still pinned v0.0.0.
      # The exemption rested on "test-only imports are invisible
      # downstream", which was true when written and silently stopped
      # being true. Checking both removes the need for anyone to notice
      # that transition again.
      - name: Verify submodule source matches the versions in go.mod
        shell: bash
        run: |-
          FAILED=0
          for MOD in dpop authjwt; do
            MODPATH="github.com/highflame-ai/zeroid/pkg/${MOD}"
            REF=$(awk -v mp="${MODPATH}" '$1 == mp { print $2; exit }' go.mod)
            if [[ -z "${REF}" ]]; then
              echo "::error::go.mod has no require directive for ${MODPATH}"
              FAILED=1
              continue
            fi
            if [[ "${REF}" == "v0.0.0" ]]; then
              echo "::error::go.mod pins ${MODPATH} to the v0.0.0 placeholder."
              echo "::error::zeroid's non-test code imports it, so consumers resolve this pin and will fail with 'unknown revision pkg/${MOD}/v0.0.0'."
              echo "::error::Point it at a real published tag."
              FAILED=1
              continue
            fi
            TAG="pkg/${MOD}/${REF}"
            if ! git rev-parse "${TAG}" >/dev/null 2>&1; then
              echo "::error::go.mod references ${MODPATH} ${REF} but tag ${TAG} does not exist."
              echo "::error::Either fix go.mod to reference an existing tag, or cut that submodule release first."
              FAILED=1
              continue
            fi
            if ! git diff --quiet "${TAG}" -- "pkg/${MOD}/"; then
              echo "::error::pkg/${MOD}/ source has drifted from ${TAG} but go.mod still references it."
              echo "::error::Releasing zeroid now would ship a binary using the OLD pkg/${MOD} ${REF}, while in-repo tests passed against the NEW local source. Silent regression risk."
              echo "::error::Fix by cutting a new pkg/${MOD} release first and updating zeroid/go.mod's reference:"
              echo "::error::  gh workflow run release-dpop.yml --field version=<next-pkg/${MOD}-vX.Y.Z>"
              FAILED=1
              continue
            fi
            echo "✓ pkg/${MOD}/ source matches ${TAG}"
          done
          [[ "${FAILED}" -eq 0 ]] || exit 1
          echo "✓ all submodule pins are real, published, and match local source — safe to release"

  tag-submodules:
    needs:
      - highflame-validate
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      # Tag pkg/authjwt at the release commit. pkg/authjwt is
      # CLUBBED with zeroid releases — its version moves in lockstep
      # with zeroid's because it's imported only from tests/integration
      # (not transitively visible to downstream consumers) and so its
      # version reference in zeroid/go.mod cannot break anything. Any
      # external consumer who imports pkg/authjwt directly gets the
      # tag at the zeroid release commit, which is the most recent
      # source.
      #
      # pkg/dpop is NOT tagged here. It has DECOUPLED release cadence
      # because it IS transitively visible to downstream consumers,
      # and zeroid/go.mod references a specific pinned pkg/dpop
      # version. Tagging pkg/dpop only happens via release-dpop.yml
      # when its source actually changes. The highflame-validate
      # job above guards against pkg/dpop source drifting from the
      # pinned version.
      - name: Tag pkg/authjwt at release commit
        shell: bash
        run: |
          VERSION="${{ env.RELEASE_TAG }}"
          SUBTAG="pkg/authjwt/${VERSION}"
          if git rev-parse "${SUBTAG}" >/dev/null 2>&1; then
            echo "Tag ${SUBTAG} already exists, skipping"
          else
            git tag "${SUBTAG}"
            git push origin "${SUBTAG}"
            echo "Created and pushed tag ${SUBTAG}"
          fi

  highflame-sast:
    needs:
      - highflame-validate
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Golang Version
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VER }}
          cache: false

      - name: Cache Go modules and build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ env.GO_VER }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_VER }}-

      - name: Run tests
        env:
          CGO_ENABLED: 0
        shell: bash
        run: |-
          make test-integration

  highflame-goreleaser:
    needs:
      - highflame-validate
      - highflame-sast
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Golang Version
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VER }}
          cache: false

      - name: Cache Go modules and build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ env.GO_VER }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_VER }}-

      - name: Create APP token
        uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ secrets.HIGHFLAME_GITHUB_APP_ID }}
          private-key: ${{ secrets.HIGHFLAME_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean

  highflame-trigger:
    needs:
      - highflame-validate
      - highflame-sast
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install GitHub CLI
        run: sudo apt install gh -y

      - name: Create APP token
        uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ secrets.HIGHFLAME_GITHUB_APP_ID }}
          private-key: ${{ secrets.HIGHFLAME_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Trigger private repo workflow
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        shell: bash
        run: |-
          gh workflow run ${{ env.CICD_WORKFLOW }} \
            --repo ${{ github.repository_owner }}/${{ env.DEVOPS_REPO }} \
            --ref ${{ env.DEVOPS_BRANCH }} \
            -f RELEASE_VER=${{ env.RELEASE_TAG }}