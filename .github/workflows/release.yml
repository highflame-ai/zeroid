name: Release Build - Zeroid

on:
  release:
    types:
      - published

env:
  GO_VER: "1.27.0"
  REGEX_PATTERN: "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
  # release.tag_name is the git tag (e.g. v1.7.0) — what consumers
  # `go get`. Not release.name, which is the human-readable display
  # title and can be customised in the UI to something like
  # "v1.7.0 — PKCE PrincipalResolver" that would fail the tag-format
  # regex. tag_name is the load-bearing identifier for every gate in
  # this workflow.
  RELEASE_TAG: ${{ github.event.release.tag_name }}
  DEVOPS_REPO: "highflame-cloud"
  DEVOPS_BRANCH: "main"
  CICD_WORKFLOW: "trigger-release-zeroid.yml"

jobs:
  highflame-validate:
    permissions:
      contents: 'read'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      # Tag format gate. The original workflow gated this on
      # `steps.validate_branch.outputs.enable_branch_build == 'true'`,
      # but `validate_branch` was never a real step in this job — the
      # gate evaluated to false and the validation silently skipped on
      # every release. Removed; the format check now actually runs.
      - name: Validate Release Tag
        id: validate_tag
        shell: bash
        run: |-
          if [[ "${{ env.RELEASE_TAG }}" =~ ${{ env.REGEX_PATTERN }} ]] ; then
            echo "Valid version format: ${{ env.RELEASE_TAG }}"
          else
            echo "Invalid version format: ${{ env.RELEASE_TAG }}"
            exit 1
          fi

      - name: Setup Golang Version
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VER }}
          cache: false

      # svu (caarlos0/svu) computes the semver bump implied by commit
      # messages since the last `v*` tag. Highflame's commit-prefix
      # convention maps cleanly onto Conventional Commits for the bumps:
      # `feat:` -> minor, `fix:` -> patch, `feat!:` / `BREAKING CHANGE:`
      # -> major. `devops:`, `build(deps)`, `[Snyk]`, `Bump` don't move
      # version numbers in svu's model, which matches our intent (those
      # are housekeeping, not user-visible).
      #
      # Behaviour: fail if the published tag is BELOW svu's
      # recommendation -- that means a `feat:` commit was missed and
      # we'd be silently shipping a feature as a patch. Allow tags AT
      # OR ABOVE the recommendation so a maintainer can manually force
      # a higher bump (e.g., release a major from a fix-only window).
      - name: Validate semver against commit history (svu)
        shell: bash
        run: |-
          go install github.com/caarlos0/svu/v3@latest
          EXPECTED="$(svu next)"
          ACTUAL="${{ env.RELEASE_TAG }}"
          echo "Published tag : ${ACTUAL}"
          echo "svu next      : ${EXPECTED}"
          # sort -V picks the highest of the two; if EXPECTED is
          # higher, ACTUAL is too low and a feat: was likely missed.
          HIGHEST="$(printf '%s\n%s\n' "${EXPECTED}" "${ACTUAL}" | sort -V | tail -1)"
          if [[ "${ACTUAL}" != "${EXPECTED}" && "${HIGHEST}" != "${ACTUAL}" ]]; then
            echo "::error::Release tag ${ACTUAL} is below svu's computed next version ${EXPECTED}."
            echo "::error::This usually means a feat: commit since the last tag implied a minor bump."
            echo "::error::Either retag at ${EXPECTED} or higher, or audit recent commit prefixes."
            exit 1
          fi
          if [[ "${ACTUAL}" != "${EXPECTED}" ]]; then
            echo "::notice::Release tag ${ACTUAL} is ahead of svu's recommendation (${EXPECTED}). Treating as an intentional manual bump."
          else
            echo "Release tag matches svu recommendation."
          fi

      # LOCKSTEP CHECK. zeroid and its nested modules (pkg/authjwt,
      # pkg/dpop) share one version, tagged at the same commit. So the
      # only thing to verify is that go.mod already NAMES the version
      # being released — the tag-submodules job then creates those tags
      # at this commit, making go.mod self-consistent by construction.
      #
      # This replaces a source-drift guard. Drift detection was the
      # right check for the old decoupled cadence, but it could only
      # ever run AFTER the release tag was pushed — and for a Go module
      # pushing the tag IS publication. v1.9.3 failed that guard
      # correctly and shipped anyway: module tag live and serving a
      # broken go.mod, with goreleaser and tag-submodules skipped.
      # Under lockstep there is no drift to detect, and this check
      # fails BEFORE any submodule tag is created.
      - name: Verify submodule pins match the release version (lockstep)
        shell: bash
        run: |-
          VERSION="${{ env.RELEASE_TAG }}"
          FAILED=0
          for MOD in dpop authjwt; do
            MODPATH="github.com/highflame-ai/zeroid/pkg/${MOD}"
            REF=$(awk -v mp="${MODPATH}" '$1 == mp { print $2; exit }' go.mod)
            if [[ -z "${REF}" ]]; then
              echo "::error::go.mod has no require directive for ${MODPATH}"
              FAILED=1
              continue
            fi
            if [[ "${REF}" != "${VERSION}" ]]; then
              echo "::error::go.mod pins ${MODPATH} to ${REF}, but this release is ${VERSION}."
              echo "::error::All modules release in lockstep, so the pins must name the version being released."
              echo "::error::Fix: make release-prep VERSION=${VERSION}   (bumps go.mod and opens a PR), then re-run."
              FAILED=1
              continue
            fi
            echo "✓ ${MODPATH} pinned at ${VERSION}"
          done
          [[ "${FAILED}" -eq 0 ]] || exit 1
          echo "✓ all module pins match ${VERSION} — safe to release"

  tag-submodules:
    needs:
      - highflame-validate
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      # Tag every nested module at the release commit. LOCKSTEP: all
      # modules carry the same version, so a consumer resolving
      # zeroid@vX.Y.Z gets pkg/dpop@vX.Y.Z and pkg/authjwt@vX.Y.Z built
      # from this exact tree — no version arithmetic, no stale-pin state.
      #
      # pkg/dpop used to be excluded here and released on its own cadence
      # via release-dpop.yml. That cadence bought nothing measurable —
      # consumers pinned mismatched versions and lagged by minors rather
      # than deliberately holding back — while the coordination it
      # required is what let the #347 replay-store fix sit unpublished.
      - name: Tag nested modules at release commit
        shell: bash
        run: |
          VERSION="${{ env.RELEASE_TAG }}"
          for MOD in authjwt dpop; do
            SUBTAG="pkg/${MOD}/${VERSION}"
            if git rev-parse "${SUBTAG}" >/dev/null 2>&1; then
              echo "Tag ${SUBTAG} already exists, skipping"
            else
              git tag "${SUBTAG}"
              git push origin "${SUBTAG}"
              echo "Created and pushed tag ${SUBTAG}"
            fi
          done

  highflame-sast:
    needs:
      - highflame-validate
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Golang Version
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VER }}
          cache: false

      - name: Cache Go modules and build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ env.GO_VER }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_VER }}-

      - name: Run tests
        env:
          CGO_ENABLED: 0
        shell: bash
        run: |-
          make test-integration

  highflame-goreleaser:
    needs:
      - highflame-validate
      - highflame-sast
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Golang Version
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VER }}
          cache: false

      - name: Cache Go modules and build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ env.GO_VER }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_VER }}-

      - name: Create APP token
        uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ secrets.HIGHFLAME_GITHUB_APP_ID }}
          private-key: ${{ secrets.HIGHFLAME_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean

  highflame-trigger:
    needs:
      - highflame-validate
      - highflame-sast
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install GitHub CLI
        run: sudo apt install gh -y

      - name: Create APP token
        uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ secrets.HIGHFLAME_GITHUB_APP_ID }}
          private-key: ${{ secrets.HIGHFLAME_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Trigger private repo workflow
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        shell: bash
        run: |-
          gh workflow run ${{ env.CICD_WORKFLOW }} \
            --repo ${{ github.repository_owner }}/${{ env.DEVOPS_REPO }} \
            --ref ${{ env.DEVOPS_BRANCH }} \
            -f RELEASE_VER=${{ env.RELEASE_TAG }}