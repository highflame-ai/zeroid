name: Release Build - Zeroid

# Run workflow bumps the nested-module pins to svu's next version, pushes
# that commit to main, then creates the GitHub release on that same
# commit. The tag is created only after go.mod names it.
#
# The release event then tags pkg/jwks, pkg/dpop and pkg/authjwt, tests,
# builds binaries, and triggers highflame-cloud. The cloud workflow
# clones that tag. It receives RELEASE_VER after the tag exists.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (vX.Y.Z). Empty uses svu's next version."
        required: false
        type: string
  release:
    types:
      - published

env:
  GO_VER: "1.27.0"
  REGEX_PATTERN: "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
  # release.tag_name is the git tag (e.g. v1.7.0) — what consumers
  # `go get`. Not release.name, which is the human-readable display
  # title and can be customised in the UI to something like
  # "v1.7.0 — PKCE PrincipalResolver" that would fail the tag-format
  # regex. tag_name is the load-bearing identifier for every gate in
  # this workflow.
  RELEASE_TAG: ${{ github.event.release.tag_name }}
  DEVOPS_REPO: "highflame-cloud"
  DEVOPS_BRANCH: "main"
  CICD_WORKFLOW: "trigger-release-zeroid.yml"

jobs:
  highflame-validate:
    if: github.event_name == 'release'
    permissions:
      contents: 'read'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      # Tag format gate. The original workflow gated this on
      # `steps.validate_branch.outputs.enable_branch_build == 'true'`,
      # but `validate_branch` was never a real step in this job — the
      # gate evaluated to false and the validation silently skipped on
      # every release. Removed; the format check now actually runs.
      - name: Validate Release Tag
        id: validate_tag
        shell: bash
        run: |-
          if [[ "${{ env.RELEASE_TAG }}" =~ ${{ env.REGEX_PATTERN }} ]] ; then
            echo "Valid version format: ${{ env.RELEASE_TAG }}"
          else
            echo "Invalid version format: ${{ env.RELEASE_TAG }}"
            exit 1
          fi

      - name: Setup Golang Version
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VER }}
          cache: false

      # svu (caarlos0/svu) computes the semver bump implied by commit
      # messages since the last `v*` tag. Highflame's commit-prefix
      # convention maps cleanly onto Conventional Commits for the bumps:
      # `feat:` -> minor, `fix:` -> patch, `feat!:` / `BREAKING CHANGE:`
      # -> major. `devops:`, `build(deps)`, `[Snyk]`, `Bump` don't move
      # version numbers in svu's model, which matches our intent (those
      # are housekeeping, not user-visible).
      #
      # Behaviour: fail if the published tag is BELOW svu's
      # recommendation -- that means a `feat:` commit was missed and
      # we'd be silently shipping a feature as a patch. Allow tags AT
      # OR ABOVE the recommendation so a maintainer can manually force
      # a higher bump (e.g., release a major from a fix-only window).
      - name: Validate semver against commit history (svu)
        shell: bash
        run: |-
          go install github.com/caarlos0/svu/v3@latest
          EXPECTED="$(svu next)"
          ACTUAL="${{ env.RELEASE_TAG }}"
          echo "Published tag : ${ACTUAL}"
          echo "svu next      : ${EXPECTED}"
          # sort -V picks the highest of the two; if EXPECTED is
          # higher, ACTUAL is too low and a feat: was likely missed.
          HIGHEST="$(printf '%s\n%s\n' "${EXPECTED}" "${ACTUAL}" | sort -V | tail -1)"
          if [[ "${ACTUAL}" != "${EXPECTED}" && "${HIGHEST}" != "${ACTUAL}" ]]; then
            echo "::error::Release tag ${ACTUAL} is below svu's computed next version ${EXPECTED}."
            echo "::error::This usually means a feat: commit since the last tag implied a minor bump."
            echo "::error::Either retag at ${EXPECTED} or higher, or audit recent commit prefixes."
            exit 1
          fi
          if [[ "${ACTUAL}" != "${EXPECTED}" ]]; then
            echo "::notice::Release tag ${ACTUAL} is ahead of svu's recommendation (${EXPECTED}). Treating as an intentional manual bump."
          else
            echo "Release tag matches svu recommendation."
          fi

      # LOCKSTEP CHECK. zeroid and its nested modules (pkg/authjwt,
      # pkg/dpop) share one version, tagged at the same commit. So the
      # only thing to verify is that go.mod already NAMES the version
      # being released — the tag-submodules job then creates those tags
      # at this commit, making go.mod self-consistent by construction.
      #
      # This replaces a source-drift guard. Drift detection was the
      # right check for the old decoupled cadence, but it could only
      # ever run AFTER the release tag was pushed — and for a Go module
      # pushing the tag IS publication. v1.9.3 failed that guard
      # correctly and shipped anyway: module tag live and serving a
      # broken go.mod, with goreleaser and tag-submodules skipped.
      # Under lockstep there is no drift to detect, and this check
      # fails BEFORE any submodule tag is created.
      # Draft-a-release path. workflow_dispatch writes the pins and the
      # tag together, so they already match. This is the other path:
      # someone ran `make release-prep VERSION=vX.Y.Z`, committed it, then
      # drafted a release. The version in that commit must be the tag.
      - name: make release-prep version matches the release tag
        shell: bash
        run: |-
          TAG="${{ env.RELEASE_TAG }}"
          FAILED=0
          for MOD in dpop authjwt jwks; do
            MODPATH="github.com/highflame-ai/zeroid/pkg/${MOD}"
            REF=$(awk -v mp="${MODPATH}" '$1 == mp { print $2; exit }' go.mod)
            if [[ -z "${REF}" ]]; then
              echo "::error::go.mod has no make release-prep pin for ${MODPATH}."
              FAILED=1
              continue
            fi
            if [[ "${REF}" != "${TAG}" ]]; then
              echo "::error::make release-prep version is ${REF}, release tag is ${TAG}. They must match."
              FAILED=1
              continue
            fi
            echo "✓ make release-prep version ${REF} matches release tag ${TAG} (${MODPATH})"
          done
          AUTHJWT_JWKS=$(awk '$1 == "github.com/highflame-ai/zeroid/pkg/jwks" { print $2; exit }' pkg/authjwt/go.mod)
          if [[ "${AUTHJWT_JWKS}" != "${TAG}" ]]; then
            echo "::error::make release-prep version in pkg/authjwt/go.mod is ${AUTHJWT_JWKS:-<missing>}, release tag is ${TAG}. They must match."
            FAILED=1
          else
            echo "✓ make release-prep version ${AUTHJWT_JWKS} matches release tag ${TAG} (pkg/authjwt → pkg/jwks)"
          fi
          if [[ "${FAILED}" -ne 0 ]]; then
            echo "::error::The committed make release-prep version does not match the release tag ${TAG}."
            echo "::error::Draft the release on the commit where you ran: make release-prep VERSION=${TAG}"
            echo "::error::Or Actions → Release Build - Zeroid → Run workflow, which commits that version and creates the tag together."
            exit 1
          fi
          echo "✓ make release-prep version matches release tag ${TAG}"

  tag-submodules:
    if: github.event_name == 'release'
    needs:
      - highflame-validate
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      # Tag every nested module at the release commit. LOCKSTEP: all
      # modules carry the same version, so a consumer resolving
      # zeroid@vX.Y.Z gets pkg/dpop@vX.Y.Z and pkg/authjwt@vX.Y.Z built
      # from this exact tree — no version arithmetic, no stale-pin state.
      #
      # pkg/dpop used to be excluded here and released on its own cadence
      # via release-dpop.yml. That cadence bought nothing measurable —
      # consumers pinned mismatched versions and lagged by minors rather
      # than deliberately holding back — while the coordination it
      # required is what let the #347 replay-store fix sit unpublished.
      - name: Tag nested modules at release commit
        shell: bash
        run: |
          VERSION="${{ env.RELEASE_TAG }}"
          # Leaf-first, deliberately. pkg/authjwt's go.mod requires pkg/jwks
          # at this same version, so tagging authjwt before jwks publishes a
          # module whose own dependency does not yet exist. The window is
          # normally milliseconds — but for a Go module PUSHING THE TAG IS
          # PUBLICATION, which is the entire lesson of the v1.9.3 incident
          # this change exists to prevent. If the job dies between the two
          # pushes, pkg/authjwt is permanently published unresolvable: the
          # same failure, one level down. Ordering costs nothing.
          for MOD in jwks dpop authjwt; do
            SUBTAG="pkg/${MOD}/${VERSION}"
            if git rev-parse "${SUBTAG}" >/dev/null 2>&1; then
              echo "Tag ${SUBTAG} already exists, skipping"
            else
              git tag "${SUBTAG}"
              git push origin "${SUBTAG}"
              echo "Created and pushed tag ${SUBTAG}"
            fi
          done

  highflame-sast:
    if: github.event_name == 'release'
    needs:
      - highflame-validate
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Golang Version
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VER }}
          cache: false

      - name: Cache Go modules and build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ env.GO_VER }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_VER }}-

      # Run the tests DIRECTLY rather than through `make test-integration`,
      # and without `-race`.
      #
      # The make target carries `-race`, which requires cgo. With
      # CGO_ENABLED=0 this job died in 0.03s on `-race requires cgo` before a
      # single test ran, and because highflame-goreleaser and
      # highflame-trigger both need it, every release since published no
      # binaries and never triggered highflame-cloud. v1.10.0 and v1.11.0 both
      # failed that way.
      #
      # CGO_ENABLED stays 0 on purpose: it is what Dockerfile and
      # .goreleaser.yml build with, so the release gate exercises the cgo
      # configuration that actually ships — notably the pure-Go net resolver,
      # which the SSRF guard and the CIMD and JWKS fetchers all depend on.
      #
      # Race coverage is not lost. pr-check.yml runs these same tests with
      # `-race` and CGO_ENABLED: 1 on every PR, inline rather than through the
      # make target, so the two are independent and the detector still sees
      # every change before it merges.
      - name: Run tests
        env:
          CGO_ENABLED: 0
        shell: bash
        run: |-
          go test ./tests/... -v -count=1 -timeout=600s

  highflame-goreleaser:
    if: github.event_name == 'release'
    needs:
      - highflame-validate
      - highflame-sast
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Golang Version
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VER }}
          cache: false

      - name: Cache Go modules and build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ env.GO_VER }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_VER }}-

      - name: Create APP token
        uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ secrets.HIGHFLAME_GITHUB_APP_ID }}
          private-key: ${{ secrets.HIGHFLAME_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean

  highflame-trigger:
    if: github.event_name == 'release'
    needs:
      - highflame-validate
      - highflame-sast
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install GitHub CLI
        run: sudo apt install gh -y

      - name: Create APP token
        uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ secrets.HIGHFLAME_GITHUB_APP_ID }}
          private-key: ${{ secrets.HIGHFLAME_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Trigger private repo workflow
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        shell: bash
        run: |-
          gh workflow run ${{ env.CICD_WORKFLOW }} \
            --repo ${{ github.repository_owner }}/${{ env.DEVOPS_REPO }} \
            --ref ${{ env.DEVOPS_BRANCH }} \
            -f RELEASE_VER=${{ env.RELEASE_TAG }}

  # Manual run, before any tag exists. release-prep commits first; the
  # release is created on that commit, so the tag and the cloud clone see
  # the same go.mod. The app token is what makes `release: published` run
  # afterwards. The default workflow token would not.
  cut-release:
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: zeroid-cut-release
      cancel-in-progress: false
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Create APP token
        uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ secrets.HIGHFLAME_GITHUB_APP_ID }}
          private-key: ${{ secrets.HIGHFLAME_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app.outputs.token }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VER }}
          cache: false

      - name: Install GitHub CLI
        run: sudo apt install gh -y

      - name: Bump pins and publish the release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          go install github.com/caarlos0/svu/v3@latest

          EXPECTED="$(svu next)"
          CURRENT="$(svu current)"
          echo "svu current : ${CURRENT}"
          echo "svu next    : ${EXPECTED}"

          if [[ -n "${INPUT_VERSION}" ]] && ! printf '%s' "${INPUT_VERSION}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must match vMAJOR.MINOR.PATCH; got ${INPUT_VERSION}"
            exit 1
          fi
          if [[ -z "${INPUT_VERSION}" ]]; then
            if [[ "${EXPECTED}" == "${CURRENT}" ]]; then
              echo "::error::No feat: or fix: commits since ${CURRENT}. Nothing to release."
              exit 1
            fi
            VERSION="${EXPECTED}"
          else
            VERSION="${INPUT_VERSION}"
            HIGHEST="$(printf '%s\n%s\n' "${EXPECTED}" "${VERSION}" | sort -V | tail -1)"
            if [[ "${VERSION}" != "${EXPECTED}" && "${HIGHEST}" != "${VERSION}" ]]; then
              echo "::error::${VERSION} is below svu's next version ${EXPECTED}."
              exit 1
            fi
          fi

          if [[ ! "${VERSION}" =~ ${REGEX_PATTERN} ]]; then
            echo "::error::Invalid version format: ${VERSION}"
            exit 1
          fi
          echo "Valid version format: ${VERSION}"

          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Tag ${VERSION} already exists. Refusing to move it."
            exit 1
          fi
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "::error::Release ${VERSION} already exists. Refusing to move it."
            exit 1
          fi
          echo "Releasing ${VERSION}"

          make release-prep VERSION="${VERSION}"
          git add -- go.mod pkg/authjwt/go.mod go.sum pkg/authjwt/go.sum go.work.sum
          if ! git diff --quiet; then
            echo "::error::release-prep changed files other than the module pins:"
            git status --porcelain
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
            git commit -m "devops: point nested-module pins at ${VERSION}"
            git push origin HEAD:main
          fi

          SHA="$(git rev-parse HEAD)"
          echo "Publishing ${VERSION} at ${SHA}"
          gh release create "${VERSION}" --target "${SHA}" --title "${VERSION}" --generate-notes